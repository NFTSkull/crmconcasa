name: Patch Mesa first paint

on:
  push:
    branches:
      - perf/mesa-first-paint-instant

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/mesa-first-paint-instant
          fetch-depth: 0

      - name: Patch page.tsx safely
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/app/mesa-control/page.tsx")
          text = path.read_text()

          old = 'import { enrichMesaBandejaPageItems } from "@/lib/mesaBandejaEnrichPage";'
          new = old + '\nimport { buildMesaBandejaFirstPaint } from "@/lib/mesaBandejaFirstPaint";'
          if text.count(old) != 1:
              raise SystemExit(f"import marker count={text.count(old)}")
          text = text.replace(old, new, 1)

          old = '  const mapExpToCaso = useCallback((exp: ExpedienteMock | MesaBandejaPageItem): CasoMock => {'
          new = '  const mapExpToCaso = useCallback((exp: ExpedienteMock | MesaBandejaPageItem): CasoConDocs => {'
          if text.count(old) != 1:
              raise SystemExit(f"mapper marker count={text.count(old)}")
          text = text.replace(old, new, 1)

          old = '    const page = exp as MesaBandejaPageItem;\n    return {'
          new = '\n'.join([
              '    const page = exp as MesaBandejaPageItem;',
              '    const firstPaint = buildMesaBandejaFirstPaint({',
              '      expedienteId: exp.id,',
              '      fechaEnvioMesa: fechaEnvioMesa ?? null,',
              '      createdAt: exp.base.createdAt,',
              '      cambioActionableAt: page.cambioActionableAt ?? null,',
              '      categoriaResumen: page.categoriaResumen ?? null,',
              '      opsHint: page.opsHint ?? null,',
              '      mesaUserId: currentUserIdRef.current,',
              '    });',
              '    return {',
          ])
          if text.count(old) != 1:
              raise SystemExit(f"first paint marker count={text.count(old)}")
          text = text.replace(old, new, 1)

          old = '      fechaEnvioMesa,\n      lastViewedByName: page.lastViewedByName ?? null,'
          new = '      fechaEnvioMesa,\n      ...firstPaint,\n      lastViewedByName: page.lastViewedByName ?? null,'
          if text.count(old) != 1:
              raise SystemExit(f"spread marker count={text.count(old)}")
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Remove temporary workflow and commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-mesa-first-paint.yml
          git add src/app/mesa-control/page.tsx
          git commit -m "perf(mesa): pintar estado desde respuesta primaria"
          git push origin HEAD:perf/mesa-first-paint-instant
