name: Patch Anette optional docs

on:
  push:
    branches:
      - feat/anette-solicitud-inscripcion-validacion-ine

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/anette-solicitud-inscripcion-validacion-ine
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply patch
        run: python3 scripts/patch_anette_optional_docs.py
      - run: npm ci
      - name: Tests focalizados
        run: |
          npx tsx --test src/domain/expediente-archivos/anette-documentos-opcionales.test.ts
          npx tsx --test src/components/asesor/AsesorScopedEquipoDocumentoSection.mount.test.ts
          npx tsx --test src/domain/asesor-equipo/asesor-integracion-opcionales-visibility.test.ts
      - name: Commit patch and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-anette-optional-docs.yml scripts/patch_anette_optional_docs.py
          git add src/domain/expediente-archivos/types.ts src/domain/expediente-archivos/integration-docs-completos.ts src/domain/expediente-archivos/cliente-scoped-equipo-documento.ts src/domain/expediente-archivos/anette-documentos-opcionales.test.ts supabase/migrations/20260910134500_anette_solicitud_inscripcion_validacion_ine_opcionales.sql
          git commit -m "feat(documentos): opcionales de inscripción para Anette"
          git push origin HEAD:feat/anette-solicitud-inscripcion-validacion-ine
