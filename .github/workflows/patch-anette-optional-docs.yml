name: Patch Anette optional docs

on:
  push:
    branches:
      - feat/anette-solicitud-inscripcion-validacion-ine

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/anette-solicitud-inscripcion-validacion-ine
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply fail-closed patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected marker once, found {n}: {old[:80]!r}")
              p.write_text(s.replace(old, new, 1))

          # 1) Catálogo frontend: dos tipos nuevos, ambos opcionales.
          replace_once(
              "src/domain/expediente-archivos/types.ts",
              '  "cliente_presupuesto",\n\n  // ===== Acuse / Aviso de retención',
              '  "cliente_presupuesto",\n  "cliente_solicitud_inscripcion",\n  "cliente_validacion_ine_60",\n\n  // ===== Acuse / Aviso de retención',
          )
          replace_once(
              "src/domain/expediente-archivos/types.ts",
              '''  cliente_presupuesto: {\n    tipo: "cliente_presupuesto",\n    label: "Presupuesto",\n    ownerRole: "cliente",\n    obligatorio: "opcional",\n    etapasRequeridas: [],\n    scopeEquipo: {\n      kind: "equipo_por_lider_email",\n      leaderEmail: "silvia.reyes@concasa.mx",\n    },\n  },\n\n  retencion_acuse_con_sello:''',
              '''  cliente_presupuesto: {\n    tipo: "cliente_presupuesto",\n    label: "Presupuesto",\n    ownerRole: "cliente",\n    obligatorio: "opcional",\n    etapasRequeridas: [],\n    scopeEquipo: {\n      kind: "equipo_por_lider_email",\n      leaderEmail: "silvia.reyes@concasa.mx",\n    },\n  },\n  /** Opcional exclusivo de Anette; el scope exacto por email se aplica en SQL/UI. */\n  cliente_solicitud_inscripcion: {\n    tipo: "cliente_solicitud_inscripcion",\n    label: "Solicitud de inscripción (2 hojas)",\n    ownerRole: "cliente",\n    obligatorio: "opcional",\n    etapasRequeridas: [],\n  },\n  /** Opcional exclusivo de Anette; el scope exacto por email se aplica en SQL/UI. */\n  cliente_validacion_ine_60: {\n    tipo: "cliente_validacion_ine_60",\n    label: "Validación INE 60%",\n    ownerRole: "cliente",\n    obligatorio: "opcional",\n    etapasRequeridas: [],\n  },\n\n  retencion_acuse_con_sello:''',
          )

          # 2) Contratos y tipos scoped reutilizando la sección PDF existente.
          replace_once(
              "src/domain/expediente-archivos/integration-docs-completos.ts",
              'export const CLIENTE_PRESUPUESTO_DOCUMENT_TIPO = "cliente_presupuesto" as const;\n',
              'export const CLIENTE_PRESUPUESTO_DOCUMENT_TIPO = "cliente_presupuesto" as const;\nexport const CLIENTE_SOLICITUD_INSCRIPCION_DOCUMENT_TIPO =\n  "cliente_solicitud_inscripcion" as const;\nexport const CLIENTE_VALIDACION_INE_60_DOCUMENT_TIPO =\n  "cliente_validacion_ine_60" as const;\n',
          )
          replace_once(
              "src/domain/expediente-archivos/integration-docs-completos.ts",
              '''export const INTEGRATION_DOC_TIPOS_ASESOR_SCOPED_POR_EQUIPO = [\n  CLIENTE_SOLICITUD_CREDITO_DOCUMENT_TIPO,\n  CLIENTE_LISTA_NOMINAL_DOCUMENT_TIPO,\n  CLIENTE_BAJO_PROTESTA_DOCUMENT_TIPO,\n  CLIENTE_PRESUPUESTO_DOCUMENT_TIPO,\n] as const;''',
              '''export const INTEGRATION_DOC_TIPOS_ASESOR_SCOPED_POR_EQUIPO = [\n  CLIENTE_SOLICITUD_CREDITO_DOCUMENT_TIPO,\n  CLIENTE_LISTA_NOMINAL_DOCUMENT_TIPO,\n  CLIENTE_BAJO_PROTESTA_DOCUMENT_TIPO,\n  CLIENTE_PRESUPUESTO_DOCUMENT_TIPO,\n  CLIENTE_SOLICITUD_INSCRIPCION_DOCUMENT_TIPO,\n  CLIENTE_VALIDACION_INE_60_DOCUMENT_TIPO,\n] as const;''',
          )
          replace_once(
              "src/domain/expediente-archivos/integration-docs-completos.ts",
              '''export const CLIENTE_PRESUPUESTO_DOCUMENT_CONTRACT = Object.freeze({\n  tipo: CLIENTE_PRESUPUESTO_DOCUMENT_TIPO,\n  label: "Presupuesto",\n  origen: "Asesor" as const,\n  formatos: ["pdf"] as const,\n  mimePermitidos: ["application/pdf"] as const,\n  maxBytes: 15 * 1024 * 1024,\n  etapaMinima: 0,\n  obligatorio: false,\n  esGateAvance: false,\n});\n''',
              '''export const CLIENTE_PRESUPUESTO_DOCUMENT_CONTRACT = Object.freeze({\n  tipo: CLIENTE_PRESUPUESTO_DOCUMENT_TIPO,\n  label: "Presupuesto",\n  origen: "Asesor" as const,\n  formatos: ["pdf"] as const,\n  mimePermitidos: ["application/pdf"] as const,\n  maxBytes: 15 * 1024 * 1024,\n  etapaMinima: 0,\n  obligatorio: false,\n  esGateAvance: false,\n});\n\nexport const CLIENTE_SOLICITUD_INSCRIPCION_DOCUMENT_CONTRACT = Object.freeze({\n  tipo: CLIENTE_SOLICITUD_INSCRIPCION_DOCUMENT_TIPO,\n  label: "Solicitud de inscripción (2 hojas)",\n  origen: "Asesor" as const,\n  formatos: ["pdf"] as const,\n  mimePermitidos: ["application/pdf"] as const,\n  maxBytes: 15 * 1024 * 1024,\n  etapaMinima: 0,\n  obligatorio: false,\n  esGateAvance: false,\n});\n\nexport const CLIENTE_VALIDACION_INE_60_DOCUMENT_CONTRACT = Object.freeze({\n  tipo: CLIENTE_VALIDACION_INE_60_DOCUMENT_TIPO,\n  label: "Validación INE 60%",\n  origen: "Asesor" as const,\n  formatos: ["pdf"] as const,\n  mimePermitidos: ["application/pdf"] as const,\n  maxBytes: 15 * 1024 * 1024,\n  etapaMinima: 0,\n  obligatorio: false,\n  esGateAvance: false,\n});\n''',
          )

          # 3) UI dedicada existente: solo se monta si RPC devuelve el tipo visible.
          replace_once(
              "src/domain/expediente-archivos/cliente-scoped-equipo-documento.ts",
              '''  CLIENTE_PRESUPUESTO_DOCUMENT_CONTRACT,\n  CLIENTE_PRESUPUESTO_DOCUMENT_TIPO,\n  CLIENTE_SOLICITUD_CREDITO_DOCUMENT_CONTRACT,''',
              '''  CLIENTE_PRESUPUESTO_DOCUMENT_CONTRACT,\n  CLIENTE_PRESUPUESTO_DOCUMENT_TIPO,\n  CLIENTE_SOLICITUD_INSCRIPCION_DOCUMENT_CONTRACT,\n  CLIENTE_SOLICITUD_INSCRIPCION_DOCUMENT_TIPO,\n  CLIENTE_VALIDACION_INE_60_DOCUMENT_CONTRACT,\n  CLIENTE_VALIDACION_INE_60_DOCUMENT_TIPO,\n  CLIENTE_SOLICITUD_CREDITO_DOCUMENT_CONTRACT,''',
          )
          replace_once(
              "src/domain/expediente-archivos/cliente-scoped-equipo-documento.ts",
              '''  {\n    tipo: CLIENTE_PRESUPUESTO_DOCUMENT_TIPO,\n    label: CLIENTE_PRESUPUESTO_DOCUMENT_CONTRACT.label,\n    uploadHint: "Documento opcional. Sube el Presupuesto en PDF (máx. 15 MB).",\n    maxBytes: CLIENTE_PRESUPUESTO_DOCUMENT_CONTRACT.maxBytes,\n  },\n] as const;''',
              '''  {\n    tipo: CLIENTE_PRESUPUESTO_DOCUMENT_TIPO,\n    label: CLIENTE_PRESUPUESTO_DOCUMENT_CONTRACT.label,\n    uploadHint: "Documento opcional. Sube el Presupuesto en PDF (máx. 15 MB).",\n    maxBytes: CLIENTE_PRESUPUESTO_DOCUMENT_CONTRACT.maxBytes,\n  },\n  {\n    tipo: CLIENTE_SOLICITUD_INSCRIPCION_DOCUMENT_TIPO,\n    label: CLIENTE_SOLICITUD_INSCRIPCION_DOCUMENT_CONTRACT.label,\n    uploadHint:\n      "Documento opcional. Sube la Solicitud de inscripción (2 hojas) en PDF (máx. 15 MB).",\n    maxBytes: CLIENTE_SOLICITUD_INSCRIPCION_DOCUMENT_CONTRACT.maxBytes,\n  },\n  {\n    tipo: CLIENTE_VALIDACION_INE_60_DOCUMENT_TIPO,\n    label: CLIENTE_VALIDACION_INE_60_DOCUMENT_CONTRACT.label,\n    uploadHint: "Documento opcional. Sube la Validación INE 60% en PDF (máx. 15 MB).",\n    maxBytes: CLIENTE_VALIDACION_INE_60_DOCUMENT_CONTRACT.maxBytes,\n  },\n] as const;''',
          )

          # 4) Test focalizado: visibles por RPC/scoped, pero nunca obligatorios.
          Path("src/domain/expediente-archivos/anette-documentos-opcionales.test.ts").write_text('''import assert from "node:assert/strict";\nimport { describe, it } from "node:test";\nimport {\n  INTEGRATION_DOC_TIPOS_ASESOR_SCOPED_POR_EQUIPO,\n  CLIENTE_SOLICITUD_INSCRIPCION_DOCUMENT_TIPO,\n  CLIENTE_VALIDACION_INE_60_DOCUMENT_TIPO,\n} from "./integration-docs-completos";\nimport { INTEGRATION_DOC_TIPOS_ASESOR_ENVIO_EXTERNOS } from "./asesor-documentos-obligatorios-envio";\nimport { SCOPED_EQUIPO_DOCUMENTO_UI } from "./cliente-scoped-equipo-documento";\nimport { parseAsesorTiposDocumentoVisibles } from "./asesor-tipos-documento-visibles";\n\ndescribe("Anette documentos opcionales", () => {\n  it("Solicitud inscripción y Validación INE 60% están en UI scoped", () => {\n    const tipos = SCOPED_EQUIPO_DOCUMENTO_UI.map((d) => d.tipo);\n    assert.ok(tipos.includes(CLIENTE_SOLICITUD_INSCRIPCION_DOCUMENT_TIPO));\n    assert.ok(tipos.includes(CLIENTE_VALIDACION_INE_60_DOCUMENT_TIPO));\n  });\n\n  it("siguen fuera del paquete obligatorio de envío externo", () => {\n    assert.ok(!INTEGRATION_DOC_TIPOS_ASESOR_ENVIO_EXTERNOS.includes(CLIENTE_SOLICITUD_INSCRIPCION_DOCUMENT_TIPO as never));\n    assert.ok(!INTEGRATION_DOC_TIPOS_ASESOR_ENVIO_EXTERNOS.includes(CLIENTE_VALIDACION_INE_60_DOCUMENT_TIPO as never));\n  });\n\n  it("parser acepta ambos cuando backend los autoriza", () => {\n    assert.deepEqual(\n      parseAsesorTiposDocumentoVisibles([\n        CLIENTE_SOLICITUD_INSCRIPCION_DOCUMENT_TIPO,\n        CLIENTE_VALIDACION_INE_60_DOCUMENT_TIPO,\n      ]),\n      [CLIENTE_SOLICITUD_INSCRIPCION_DOCUMENT_TIPO, CLIENTE_VALIDACION_INE_60_DOCUMENT_TIPO],\n    );\n    assert.ok(INTEGRATION_DOC_TIPOS_ASESOR_SCOPED_POR_EQUIPO.includes(CLIENTE_SOLICITUD_INSCRIPCION_DOCUMENT_TIPO));\n    assert.ok(INTEGRATION_DOC_TIPOS_ASESOR_SCOPED_POR_EQUIPO.includes(CLIENTE_VALIDACION_INE_60_DOCUMENT_TIPO));\n  });\n});\n''')

          # 5) Migración backend. No toca datos; solo funciones/allowlist específicas.
          Path("supabase/migrations/20260910134500_anette_solicitud_inscripcion_validacion_ine_opcionales.sql").write_text(r'''-- ConCasa CRM — Anette: Solicitud de inscripción + Validación INE 60% opcionales.
-- Scope exacto: anette.perez@concasa.mx.
-- NO modifica documentos obligatorios de envío, expedientes ni datos existentes.

CREATE OR REPLACE FUNCTION public.integration_doc_tipos_asesor_upload_para(p_asesor_id uuid)
RETURNS text[]
LANGUAGE plpgsql
STABLE SECURITY DEFINER
SET search_path TO 'public'
AS $function$
DECLARE
  v_base TEXT[];
  v_is_anette BOOLEAN := FALSE;
BEGIN
  SELECT EXISTS (
    SELECT 1
    FROM public.profiles p
    WHERE p.id = p_asesor_id
      AND p.active = true
      AND p.app_role = 'asesor'
      AND lower(btrim(p.email)) = 'anette.perez@concasa.mx'
  ) INTO v_is_anette;

  IF public.asesor_paquete_documental_externos(p_asesor_id) THEN
    v_base := public.integration_doc_tipos_asesor_envio_para(p_asesor_id) || ARRAY[
      'cliente_acta_nacimiento_digital',
      'cliente_constancia_situacion_fiscal',
      'cliente_semanas_cotizadas',
      'cliente_vigencia_derechos'
    ]::TEXT[];
  ELSE
    v_base := public.integration_doc_tipos_asesor_upload();
  END IF;

  IF v_is_anette THEN
    IF NOT ('cliente_solicitud_inscripcion' = ANY(v_base)) THEN
      v_base := array_append(v_base, 'cliente_solicitud_inscripcion');
    END IF;
    IF NOT ('cliente_validacion_ine_60' = ANY(v_base)) THEN
      v_base := array_append(v_base, 'cliente_validacion_ine_60');
    END IF;
  END IF;

  RETURN v_base;
END;
$function$;

CREATE OR REPLACE FUNCTION public.asesor_puede_usar_tipo_documento(p_actor_id uuid, p_tipo_documento text)
RETURNS boolean
LANGUAGE plpgsql
STABLE SECURITY DEFINER
SET search_path TO 'public'
AS $function$
DECLARE
  v_tipo TEXT;
  v_leader_emails TEXT[];
  v_leader_email TEXT;
  v_actor_org UUID;
  v_team_ids UUID[];
  v_n INTEGER;
  v_team_id UUID;
BEGIN
  v_tipo := NULLIF(lower(btrim(COALESCE(p_tipo_documento, ''))), '');
  IF p_actor_id IS NULL OR v_tipo IS NULL THEN
    RETURN false;
  END IF;

  -- P271: estos dos tipos son exclusivos de Anette y siempre opcionales.
  IF v_tipo IN ('cliente_solicitud_inscripcion', 'cliente_validacion_ine_60') THEN
    RETURN EXISTS (
      SELECT 1
      FROM public.profiles p
      WHERE p.id = p_actor_id
        AND p.active = true
        AND p.app_role = 'asesor'
        AND lower(btrim(p.email)) = 'anette.perez@concasa.mx'
    );
  END IF;

  SELECT coalesce(
    array_agg(DISTINCT lower(btrim(s.leader_email)) ORDER BY lower(btrim(s.leader_email))),
    ARRAY[]::TEXT[]
  )
  INTO v_leader_emails
  FROM public.documento_tipo_scope_equipo s
  WHERE lower(btrim(s.tipo_documento)) = v_tipo
    AND s.active = true;

  IF coalesce(cardinality(v_leader_emails), 0) = 0 THEN
    RETURN true;
  END IF;

  SELECT p.organization_id
  INTO v_actor_org
  FROM public.profiles p
  WHERE p.id = p_actor_id
    AND p.active = true
    AND p.app_role = 'asesor';

  IF NOT FOUND OR v_actor_org IS NULL THEN
    RETURN false;
  END IF;

  FOREACH v_leader_email IN ARRAY v_leader_emails
  LOOP
    SELECT coalesce(array_agg(t.id), ARRAY[]::uuid[])
    INTO v_team_ids
    FROM public.asesor_equipos t
    INNER JOIN public.profiles lider
      ON lider.id = t.leader_id
     AND lider.active = true
     AND lider.app_role = 'asesor'
    WHERE t.active = true
      AND t.organization_id = v_actor_org
      AND lower(btrim(lider.email)) = v_leader_email;

    v_n := coalesce(cardinality(v_team_ids), 0);
    IF v_n = 1 THEN
      v_team_id := v_team_ids[1];
      IF public.asesor_pertenece_equipo_activo(v_team_id, p_actor_id) THEN
        RETURN true;
      END IF;
    ELSIF v_n <> 0 THEN
      RAISE WARNING 'asesor_puede_usar_tipo_documento: fail-closed tipo=% leader_email=% team_count=% actor=% org=% (más de un equipo activo para ese líder)',
        v_tipo, v_leader_email, v_n, p_actor_id, v_actor_org;
    END IF;
  END LOOP;

  RETURN false;
END;
$function$;

CREATE OR REPLACE FUNCTION public.asesor_tipos_documento_visibles()
RETURNS text[]
LANGUAGE plpgsql
STABLE SECURITY DEFINER
SET search_path TO 'public'
AS $function$
DECLARE
  v_actor_id UUID;
  v_tipos TEXT[] := ARRAY[]::TEXT[];
  v_tipo TEXT;
  v_is_anette BOOLEAN := FALSE;
BEGIN
  v_actor_id := public.current_profile_id();
  IF v_actor_id IS NULL THEN
    RETURN ARRAY[]::TEXT[];
  END IF;

  SELECT
    lower(btrim(p.email)) = 'anette.perez@concasa.mx'
  INTO v_is_anette
  FROM public.profiles p
  WHERE p.id = v_actor_id
    AND p.active = true
    AND p.app_role = 'asesor';

  IF NOT FOUND THEN
    RETURN ARRAY[]::TEXT[];
  END IF;

  FOR v_tipo IN
    SELECT DISTINCT s.tipo_documento
    FROM public.documento_tipo_scope_equipo s
    WHERE s.active = true
    ORDER BY 1
  LOOP
    IF public.asesor_puede_usar_tipo_documento(v_actor_id, v_tipo) THEN
      v_tipos := array_append(v_tipos, v_tipo);
    END IF;
  END LOOP;

  IF v_is_anette THEN
    v_tipos := array_append(v_tipos, 'cliente_solicitud_inscripcion');
    v_tipos := array_append(v_tipos, 'cliente_validacion_ine_60');
  END IF;

  RETURN v_tipos;
END;
$function$;

-- Post-Mesa: permitir crear por primera vez estos opcionales de Anette sin volverlos globales.
DO $do$
DECLARE
  v_oid oid;
  v_def text;
  v_old text;
  v_new text;
  v_count integer;
BEGIN
  SELECT p.oid INTO v_oid
  FROM pg_proc p
  JOIN pg_namespace n ON n.oid = p.pronamespace
  WHERE n.nspname = 'public'
    AND p.proname = 'register_expediente_documento_pre_reingreso'
    AND pg_get_function_identity_arguments(p.oid) =
      'p_expediente_id uuid, p_tipo_documento text, p_storage_path text, p_nombre_original text, p_mime_type text, p_size_bytes bigint';

  IF v_oid IS NULL THEN
    RAISE EXCEPTION 'anette_optional_docs: register_expediente_documento_pre_reingreso signature not found';
  END IF;

  v_def := pg_get_functiondef(v_oid);
  v_old := E'    ELSIF v_tipo = ANY(public.integration_doc_tipos_asesor_opcionales()) THEN\n      NULL;\n    ELSE';
  v_count := (length(v_def) - length(replace(v_def, v_old, ''))) / length(v_old);
  IF v_count <> 1 THEN
    RAISE EXCEPTION 'anette_optional_docs: post-Mesa optional marker count %, expected 1', v_count;
  END IF;

  v_new := E'    ELSIF v_tipo = ANY(public.integration_doc_tipos_asesor_opcionales())\n       OR (\n         v_tipo IN (''cliente_solicitud_inscripcion'', ''cliente_validacion_ine_60'')\n         AND EXISTS (\n           SELECT 1 FROM public.profiles p\n           WHERE p.id = v_actor_id\n             AND p.active = true\n             AND p.app_role = ''asesor''\n             AND lower(btrim(p.email)) = ''anette.perez@concasa.mx''\n         )\n       ) THEN\n      NULL;\n    ELSE';

  v_def := replace(v_def, v_old, v_new);
  EXECUTE v_def;
END;
$do$;

COMMENT ON FUNCTION public.integration_doc_tipos_asesor_upload_para(uuid) IS
  'Allowlist upload asesor; Anette añade Solicitud de inscripción + Validación INE 60% como opcionales exclusivos.';
COMMENT ON FUNCTION public.asesor_tipos_documento_visibles() IS
  'UI scoped: equipo + dos opcionales exclusivos de Anette (Solicitud inscripción / Validación INE 60%).';
''')
          PY
      - run: npm ci
      - name: Tests focalizados
        run: |
          npx tsx --test \
            src/domain/expediente-archivos/anette-documentos-opcionales.test.ts \
            src/components/asesor/AsesorScopedEquipoDocumentoSection.mount.test.ts \
            src/domain/asesor-equipo/asesor-integracion-opcionales-visibility.test.ts
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-anette-optional-docs.yml
          git add src/domain/expediente-archivos/types.ts \
                  src/domain/expediente-archivos/integration-docs-completos.ts \
                  src/domain/expediente-archivos/cliente-scoped-equipo-documento.ts \
                  src/domain/expediente-archivos/anette-documentos-opcionales.test.ts \
                  supabase/migrations/20260910134500_anette_solicitud_inscripcion_validacion_ine_opcionales.sql
          git commit -m "feat(documentos): opcionales de inscripción para Anette"
          git push origin HEAD:feat/anette-solicitud-inscripcion-validacion-ine
