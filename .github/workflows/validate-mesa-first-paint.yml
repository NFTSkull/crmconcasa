name: Validate Mesa first paint

on:
  push:
    branches:
      - perf/mesa-first-paint-instant

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/mesa-first-paint-instant
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit first paint
        run: npx tsx --test src/lib/mesaBandejaFirstPaint.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Remove temporary workflow after PASS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-mesa-first-paint.yml
          git commit -m "chore: cerrar validación first-paint"
          git push origin HEAD:perf/mesa-first-paint-instant
