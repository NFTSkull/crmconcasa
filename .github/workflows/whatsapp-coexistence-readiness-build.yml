name: WhatsApp Coexistence preflight build (no production credentials)
on:
  push:
    branches: [feat/whatsapp-coexistence-preflight]
    paths:
      - .github/workflows/whatsapp-coexistence-readiness-build.yml
      - src/app/asesor/whatsapp/**
      - src/app/asesor/whatsapp-piloto/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build production bundle using dummy configuration
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_USE_SUPABASE_AUTH: 'false'
          NEXT_PUBLIC_DATA_MODE: mock
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.local
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
        run: npm run build
