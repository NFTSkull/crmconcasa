name: Temporary admin period-stage patch v3

on:
  push:
    branches:
      - fix/admin-period-stage-breakdown

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-period-stage-breakdown
          fetch-depth: 0

      - name: Reuse focused patch from v2
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/tmp-admin-period-stage-breakdown-v2.yml').read_text()
          marker = '      - name: Apply focused source patch\n        run: |\n'
          start = src.index(marker) + len(marker)
          end = src.index('\n      - name: Validate source contracts', start)
          lines = src[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-period-stage.sh').write_text(script)
          PY
          bash /tmp/apply-period-stage.sh

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate source contracts
        run: |
          git diff --check
          node --test --import tsx src/app/admin/page.admin-filters.contract.test.ts src/domain/admin-production/admin-ui-filters.test.ts src/domain/admin-production/admin-visible-stages.test.ts

      - name: Commit focused patch
        run: |
          rm -f .github/workflows/tmp-admin-period-stage-breakdown-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(admin): mostrar todas las etapas del periodo"
          git push origin HEAD:fix/admin-period-stage-breakdown
